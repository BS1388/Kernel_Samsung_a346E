###############################################################################
# Build A346E Kernel -- Samsung Galaxy A34 5G (a34x), MediaTek mt6877, GKI 6.6
#
# Pipeline (numbered steps, all inside ONE job so nothing is thrown away):
#   #1 Checkout & Detect → #2 System Prep → #3 External Deps → #4 Patches
#     → #5 KernelSU → #6 Build → #7 Upload
#   A final "Summary" job reports the result and opens an issue on failure.
#
# Why one job: every job runs on its OWN fresh runner with its OWN checkout.
# The old 7-job layout re-cloned the repo 7 times and threw away everything
# jobs #2..#5 did -- the permissive patch in particular was applied on a runner
# that was then discarded, so `permissive: true` silently produced an ENFORCING
# kernel. Numbered steps keep the same readable pipeline without that bug.
#
# Variant: workflow_dispatch picks ONE of NO-ROOT / KSUN / KSUN-SUSFS-v1.5.12.
# A push to arena/** builds KSUN (that is the variant we actually flash).
###############################################################################
name: Build A346E Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "Choose KernelSU variant"
        required: true
        type: choice
        options:
          - NO-ROOT
          - KSUN
          - KSUN-SUSFS-v1.5.12
        default: KSUN
      permissive:
        description: "Make SELinux permissive?"
        type: boolean
        required: true
        default: false
      custom_patches:
        description: "Also apply extra patches from patch/*.patch? (patch/compat-kernel-6.6/* is ALWAYS applied)"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - A346E
      - a346E-Stock
      - Google
      - Test-Build
      - "arena/**"
  pull_request:
    branches:
      - A346E
      - "arena/**"

permissions:
  contents: read
  issues: write

# a newer push on the same branch supersedes older, still running builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  G_EXT: ${{ github.workspace }}/external_deps
  # workflow_dispatch: whatever the user picked.
  # push on arena/**: build KSUN (that is the variant we actually flash).
  KSU_VAR: ${{ github.event.inputs.ksu_variant || (github.event_name == 'push' && 'KSUN') || 'NO-ROOT' }}
  PERMISSIVE: ${{ github.event.inputs.permissive || 'false' }}
  CUSTOM_PATCH: ${{ github.event.inputs.custom_patches || 'false' }}

jobs:
  # ==========================================================================
  # Build: #1 Checkout → #7 Upload
  # ==========================================================================
  build:
    name: "Build kernel (#1 → #7)"
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      ksu_tag: ${{ steps.kernelsu.outputs.ksu_tag }}
      ksu_code: ${{ steps.kernelsu.outputs.ksu_code }}
      image_size: ${{ steps.build.outputs.image_size }}
      artifact: ${{ steps.names.outputs.artifact }}

    steps:
      # ---------------------------------------------------------------- #1 --
      - name: "#1 Checkout repository"
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: "#1 Detect kernel dir & build options"
        id: names
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then
            REAL_DIR="Kernel-6.6"
          elif [ -f "kernel-6.6/Makefile" ]; then
            REAL_DIR="kernel-6.6"
          else
            echo "::error::No kernel tree found (looked for Kernel-6.6/ and kernel-6.6/)"
            ls -la
            exit 1
          fi
          echo "REAL_DIR=$REAL_DIR"          >> "$GITHUB_ENV"
          echo "G_KERNEL=$GITHUB_WORKSPACE/$REAL_DIR" >> "$GITHUB_ENV"

          SEL=$([ "${PERMISSIVE}" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "${CUSTOM_PATCH}" = "true" ] && echo custom || echo nocustom)
          echo "artifact=kernel-image-${KSU_VAR}-${SEL}-${CUS}" >> "$GITHUB_OUTPUT"

          [ -f "$REAL_DIR/arch/arm64/configs/gki_defconfig" ] \
            || { echo "::error::gki_defconfig missing in $REAL_DIR"; exit 1; }

          if [ ! -f Google-FDO/kernel.afdo ] && [ -d google-FDO ]; then
            mv google-FDO Google-FDO
          fi
          [ -f Google-FDO/kernel.afdo ] || echo "::warning::Google-FDO/kernel.afdo missing (build will be slower / may fail)"

          {
            echo "## Build A346E Kernel"
            echo ""
            echo "| option | value |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| KSUN source | \`dev branch HEAD (latest at run time)\` |"
            echo "| SELinux | \`${SEL}\` |"
            echo "| Extra patches (patch/*.patch) | \`${CUSTOM_PATCH}\` |"
            echo "| Kernel tree | \`${REAL_DIR}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- #2 --
      - name: "#2 System prep: free disk space"
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          sudo apt-get remove --purge -y '^php.*' '^dotnet-.*' '^mysql-.*' \
                      '^firefox.*' '^mongodb-.*' '^postgresql-.*' azure-cli \
                      google-chrome-stable google-cloud-cli >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo "--- after ---"; df -h /

      - name: "#2 System prep: install host dependencies"
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            curl wget unzip git rsync ca-certificates \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev dwarves \
            lz4 zstd cpio libxml2-utils xsltproc \
            python3 python3-pip python3-setuptools python3-dev \
            zlib1g-dev libbz2-dev liblz4-dev libzstd-dev
          git config --global user.email "builder@example.com"
          git config --global user.name  "Builder"
          git config --global --add safe.directory "*"
          echo "CPUs: $(nproc) | RAM: $(free -g | awk '/Mem:/{print $2}')G | Disk: $(df -h --output=avail / | tail -1)"

      # ---------------------------------------------------------------- #3 --
      # Only the SUSFS variant needs external repos. (AnyKernel3 used to be
      # cloned here and never used -- dropped.)
      - name: "#3 External deps (SUSFS only)"
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          [ -d susfs4ksu ] || git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 --depth 1
          ( cd susfs4ksu
            git fetch --depth 1 origin f450ec00bf592d080f59b01ff6f9242456c9a427 || true
            git checkout f450ec00bf592d080f59b01ff6f9242456c9a427 || echo "::warning::SUSFS pinned commit unavailable, using HEAD" )
          for repo in https://github.com/xnnnsets/kernel_patches.git \
                      https://github.com/xnnnsets/patch.git \
                      https://github.com/SukiSU-Ultra/SukiSU_patch.git; do
            dir=$(basename "$repo" .git)
            [ -d "$dir" ] || git clone "$repo" --depth 1
          done
          ls -1

      # ---------------------------------------------------------------- #4 --
      # NOTE: the two always-needed patch sets are handled by build_kernel.sh
      #   * patch/compat-kernel-6.6/*.patch  -> apply_compat_patches()
      #   * Permissive/ + patch/*.patch      -> apply_optional_patches()
      #                                         (driven by $PERMISSIVE / $CUSTOM_PATCH)
      # so they are applied in the same place the build happens and can never
      # get lost again. Only the SUSFS kernel-side patches live here.
      - name: "#4 Patches: SUSFS kernel side"
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          SUSFS_DIR="$G_EXT/susfs4ksu"
          [ -d "$SUSFS_DIR" ] || { echo "::error::susfs4ksu missing"; exit 1; }
          cp -v "$SUSFS_DIR"/kernel_patches/include/linux/* "$G_KERNEL/include/linux/" || true
          cp -v "$SUSFS_DIR"/kernel_patches/fs/*            "$G_KERNEL/fs/"            || true
          cd "$G_KERNEL"
          for p in "$G_EXT/patch/6.6/Dont_reduce_TTL.patch" \
                   "$G_EXT/kernel_patches/wild/hooks/scope_min_manual_hooks_v1.4.patch" \
                   "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" \
                   "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/1_fix_base.c.patch"; do
            echo "--- $(basename "$p")"
            patch -p1 --forward --batch < "$p" || echo "::warning::$(basename "$p") failed / already applied"
          done

      - name: "#4 Patches: drop GKI protected-exports restriction (SUSFS only)"
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          grep -rl "protected_exports_list" --include="BUILD.bazel" "$REAL_DIR" 2>/dev/null | while read -r f; do
            echo "patching $f"
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find "$REAL_DIR" -iname "abi_gki_protected_exports*" -type f -delete 2>/dev/null || true

      # ---------------------------------------------------------------- #5 --
      - name: "#5 KernelSU-Next"
        id: kernelsu
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          cd "$G_KERNEL"
          rm -rf KernelSU-Next

          case "$KSU_VAR" in
            KSUN)
              # setup.sh does a FRESH clone every run -> always the newest dev
              # HEAD, today and in a year. No tag, no pinning, no input.
              echo "KernelSU-Next: dev branch HEAD (latest at run time)"
              curl -LSs --retry 3 https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh dev
              ;;
            KSUN-SUSFS-v1.5.12)
              echo "KernelSU-Next: xnnnsets fork, branch next-1 (SUSFS)"
              curl -LSs --retry 3 https://raw.githubusercontent.com/xnnnsets/KernelSU-Next/refs/heads/next-1/kernel/setup.sh -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh next-1
              for p in "$G_EXT/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_core_hook.c.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_sucompat.c.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_kernel_compat.c.patch"; do
                echo "--- $(basename "$p")"
                patch -p1 -d ./KernelSU-Next --forward --batch < "$p" || echo "::warning::$(basename "$p") failed / already applied"
              done
              ;;
            *)
              echo "::error::Unknown KSU variant '$KSU_VAR'"; exit 1 ;;
          esac

          [ -d KernelSU-Next ] || { echo "::error::KernelSU-Next missing after setup.sh"; exit 1; }
          cd KernelSU-Next
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          KSU_CODE=$((30000 + $(git rev-list --count HEAD 2>/dev/null || echo 0)))
          KSU_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)

          # Fix "v0.0.1 (1-2)" in the manager: build_kernel.sh copies the tree
          # into the bazel workspace with `rsync --copy-links`, which turns the
          # drivers/kernelsu -> ../KernelSU-Next/kernel symlink into a plain
          # copy. At compile time Kbuild can then no longer find its own git
          # repo and falls back to KSU_VERSION=1 / KSU_VERSION_TAG=v0.0.1.
          # -> bake the real values into those fallback lines.
          if [ -f kernel/Kbuild ] && grep -q KSU_VERSION_FALLBACK kernel/Kbuild; then
            sed -i "s|^KSU_VERSION_FALLBACK := .*|KSU_VERSION_FALLBACK := ${KSU_CODE}|"     kernel/Kbuild
            sed -i "s|^KSU_VERSION_TAG_FALLBACK := .*|KSU_VERSION_TAG_FALLBACK := ${KSU_TAG}|" kernel/Kbuild
            grep -n "KSU_VERSION_FALLBACK\|KSU_VERSION_TAG_FALLBACK" kernel/Kbuild
          else
            echo "::warning::KSU_VERSION_FALLBACK not found in kernel/Kbuild (layout changed?)"
          fi

          # exported for build_kernel.sh (stamp_ksu_version fallback) + summary
          {
            echo "KSU_GIT_TAG=$KSU_TAG"
            echo "KSU_VERSION=$KSU_CODE"
            echo "KSU_COMMIT=$KSU_SHA"
          } >> "$GITHUB_ENV"
          {
            echo "ksu_tag=$KSU_TAG"
            echo "ksu_code=$KSU_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $KSU_TAG ($KSU_CODE) @ $KSU_SHA"

      - name: "#5 Defconfig (KSU + IPSet)"
        run: |
          set -eu
          DEFCONFIG="$G_KERNEL/arch/arm64/configs/gki_defconfig"
          # Everything we add lives between markers, so re-running only ever
          # replaces our own block and never touches upstream lines
          # (the old code deleted CONFIG_KPROBES=y and only put it back for
          #  KSUN -- NO-ROOT builds silently lost kprobes).
          sed -i '/^# >>> a346e-ci$/,/^# <<< a346e-ci$/d' "$DEFCONFIG"
          echo "# >>> a346e-ci" >> "$DEFCONFIG"

          case "$KSU_VAR" in
            KSUN)
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          EOF
              ;;
            KSUN-SUSFS-v1.5.12)
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_MODULES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
              ;;
          esac

          # IPSet (needed by most firewall / adblock apps) -- all variants
          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
          echo "# <<< a346e-ci" >> "$DEFCONFIG"
          echo "--- defconfig tail ---"; tail -n 30 "$DEFCONFIG"

      # ---------------------------------------------------------------- #6 --
      - name: "#6 Build kernel"
        id: build
        run: |
          set -eu
          chmod +x ./build_kernel.sh
          # PERMISSIVE / CUSTOM_PATCH are read by build_kernel.sh
          # (apply_optional_patches) so CI and local builds behave identically.
          if ! bash ./build_kernel.sh 2>&1 | tee build.log; then
            echo "::error::build_kernel.sh failed -- see the build-log artifact"
            tail -n 60 build.log || true
            exit 1
          fi
          [ -f Image ] || { echo "::error::Image not produced"; find out -name Image -type f | head; exit 1; }
          SIZE=$(du -h Image | awk '{print $1}')
          echo "image_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Image: $SIZE  sha256: $(sha256sum Image | cut -c1-32)..."

      # ---------------------------------------------------------------- #7 --
      - name: "#7 Upload Image"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: Image
          if-no-files-found: error
          compression-level: 6

      - name: "#7 Upload build log (only when the build fails)"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: "Summary"
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          set -eu
          {
            echo "### Result: \`${{ needs.build.result }}\`"
            echo ""
            echo "- KSU variant: \`${KSU_VAR}\`"
            echo "- KernelSU-Next: \`${{ needs.build.outputs.ksu_tag || 'n/a' }}\` (\`${{ needs.build.outputs.ksu_code || 'n/a' }}\`)"
            echo "- SELinux: \`$([ "${PERMISSIVE}" = 'true' ] && echo permissive || echo enforcing)\`"
            echo "- Image: \`${{ needs.build.outputs.image_size || 'n/a' }}\` -> artifact \`${{ needs.build.outputs.artifact }}\`"
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when the build fails
        if: needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > issue.md <<EOF
          Build failed: [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          | field | value |
          |---|---|
          | commit | \`${{ github.sha }}\` |
          | branch | \`${{ github.ref_name }}\` |
          | KSU | \`${KSU_VAR}\` |
          | permissive | \`${PERMISSIVE}\` |
          | extra patches | \`${CUSTOM_PATCH}\` |

          The \`build-log-${{ github.run_id }}\` artifact of that run has the full log.
          EOF
          gh issue create --title "Build failed #${{ github.run_id }} [${KSU_VAR}]" --body-file issue.md || true
