name: Build A346E Kernel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo apt-get remove --purge -y "php*" "dotnet*" "mysql*" "nodejs*" "clang*" "google*" || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/local /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY"

      - name: Run build script
        run: |
          chmod +x ./build_kernel.sh
          bash ./build_kernel.sh

      - name: Upload kernel Image artifact
        uses: actions/upload-artifact@v5
        with:
          name: kernel-image
          path: Image
