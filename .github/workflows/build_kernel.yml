name: Build A346E Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a07254-kernel-samsung-a346e
      - Google
      - Test-Build
      - a346E-Stock

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write

    steps:
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          set -eux
          df -h
          # Remove large unnecessary toolchains to free space for kernel build
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo apt-get remove --purge -y "php*" "dotnet*" "mysql*" "nodejs*" "google*" "firefox*" "mongodb*" "postgresql*" "azure-cli*" || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h

      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y \
            curl wget unzip git rsync \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev dwarves \
            lz4 zstd cpio \
            libxml2-utils xsltproc \
            python3 python3-pip python3-setuptools python3-dev \
            zlib1g-dev libbz2-dev liblz4-dev libzstd-dev

          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          git config --global --add safe.directory "*"

          echo "--- Versions ---"
          python3 --version
          git --version
          nproc
          free -h
          df -h

      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set -euxo pipefail
          chmod +x ./build_kernel.sh
          # Capture full log while still showing output
          bash ./build_kernel.sh 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build script exit code: $EXIT_CODE"
          ls -lh Image build.log || true
          df -h
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::build_kernel.sh failed with $EXIT_CODE"
            exit $EXIT_CODE
          fi
          # Verify Image exists
          if [ ! -f Image ]; then
            echo "::error::Image not found after build"
            echo "Searching for Image in out/ ..."
            find out -type f -name "Image" | head -n 20 || true
            ls -R out/target/product/a34x/obj/KLEAF_OBJ/dist 2>&1 | head -n 100 || true
            exit 1
          fi
          echo "✅ Image ready: $(ls -lh Image)"

      # ------------------------------------------------------------
      - name: Upload kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          # Only upload the final Image, build.log is uploaded separately
          path: |
            Image
            out/target/product/a34x/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/Image
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      - name: Create issue with build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          LOG_FILE=build.log
          TAIL_FILE=build_tail.log
          tail -n 4000 "$LOG_FILE" > "$TAIL_FILE" || true
          # Truncate to 60k chars for GitHub issue limit (65536)
          BODY=$(tail -c 60000 "$TAIL_FILE")
          # Build issue body (use heredoc to avoid escaping issues)
          cat > issue_body.txt <<EOF
          Build failed for run ${{ github.run_id }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          \`\`\`
          $BODY
          \`\`\`

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          # Create issue
          gh issue create \
            --title "Build log for failed run ${{ github.run_id }}" \
            --body-file issue_body.txt || \
          gh api repos/${{ github.repository }}/issues -X POST \
            -f title="Build log for failed run ${{ github.run_id }}" \
            --raw-field body="$(cat issue_body.txt)" || true
