###############################################################################
# Build A346E Kernel -- Samsung Galaxy A34 5G (a34x), MediaTek mt6877, GKI 6.6
#
# Pipeline (7 boxes, linear):
#   #1 Checkout & Detect → #2 System Prep → #3 External Deps → #4 Patches
#     → #5 KernelSU → #6 Build → #7 Upload & Summary
#
# #1..#5 are FAST pre-flight jobs (~1 min each): they validate everything the
# build needs -- every patch is dry-run applied, the KernelSU-Next version is
# resolved, the defconfig plan is printed -- so a broken patch fails the run in
# a minute instead of 50 minutes into the compile.
# #6 is the real build: it is self-contained (it re-does checkout, deps, KSU,
# patches) because every job runs on its OWN fresh runner. That is also why the
# permissive patch is applied by build_kernel.sh (apply_optional_patches) and
# not by a pre-flight job -- doing it in a pre-flight job silently produced an
# ENFORCING kernel while the artifact said "permissive".
#
# Variant: workflow_dispatch picks ONE of NO-ROOT / KSUN / KSUN-SUSFS-v1.5.12.
# A push to arena/** builds KSUN (that is the variant we actually flash).
#
# NOTE (KSUN-SUSFS-v1.5.12 only): KernelSU-Next for this variant comes from
# xnnnsets/KernelSU-Next @ next-1 -- a personal fork that, unlike susfs4ksu,
# is NOT pinned to a commit (always tracks that branch's current HEAD). If
# that branch moves, the SUSFS patches below (10_enable_susfs_for_ksu.patch,
# 50_add_susfs_in_gki-android15-6.6.patch, the fix_*.c.patch set) can stop
# applying cleanly, and the fork may also lag the upstream KSU_VERSION_FALLBACK
# Kbuild mechanism (cosmetic: KSU version shows as v0.0.1 in Manager). Patch
# failures below now fail the build loudly instead of a silent warning --
# see the APPLIED/ALREADY/BROKEN checks in "SUSFS kernel patches" and
# "Add KernelSU-Next". To stop the drift at the source, pin the fork once you
# have a known-good commit:
#   git -C KernelSU-Next checkout <KNOWN_GOOD_SHA>
# (find <KNOWN_GOOD_SHA> from a previous successful run's "KernelSU-Next ...@ <sha>"
# log line in the "Add KernelSU-Next" step).
###############################################################################
name: Build A346E Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "Choose KernelSU variant"
        required: true
        type: choice
        options:
          - NO-ROOT
          - KSUN
          - KSUN-SUSFS-v1.5.12
        default: KSUN
      permissive:
        description: "Make SELinux permissive?"
        type: boolean
        required: true
        default: false
      custom_patches:
        description: "Also apply extra patches from patch/*.patch?"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - A346E
      - a346E-Stock
  pull_request:
    branches:
      - A346E
      - "arena/**"

permissions:
  contents: read
  issues: write

# a newer push on the same branch supersedes older, still running builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  G_EXT: ${{ github.workspace }}/external_deps
  # workflow_dispatch: whatever the user picked.
  # push on arena/**: build KSUN (that is the variant we actually flash).
  KSU_VAR: ${{ github.event.inputs.ksu_variant || (github.event_name == 'push' && 'KSUN') || 'NO-ROOT' }}
  PERMISSIVE: ${{ github.event.inputs.permissive || 'false' }}
  CUSTOM_PATCH: ${{ github.event.inputs.custom_patches || 'false' }}

jobs:
  # ==========================================================================
  # #1 Checkout & Detect
  # ==========================================================================
  detect:
    name: "#1 Checkout & Detect"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect kernel tree & build options
        id: detect
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then
            REAL_DIR="Kernel-6.6"
          elif [ -f "kernel-6.6/Makefile" ]; then
            REAL_DIR="kernel-6.6"
          else
            echo "::error::No kernel tree found (looked for Kernel-6.6/ and kernel-6.6/)"; ls -la; exit 1
          fi
          [ -f "$REAL_DIR/arch/arm64/configs/gki_defconfig" ] \
            || { echo "::error::gki_defconfig missing in $REAL_DIR"; exit 1; }

          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "$CUSTOM_PATCH" = "true" ] && echo custom || echo nocustom)
          if [ ! -f Google-FDO/kernel.afdo ] && [ -d google-FDO ]; then mv google-FDO Google-FDO; fi
          [ -f Google-FDO/kernel.afdo ] || echo "::warning::Google-FDO/kernel.afdo missing"

          echo "kernel tree : $REAL_DIR ($(grep -m1 -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' -A2 "$REAL_DIR/Makefile" | tr '\n' ' '))"
          echo "KSU variant : $KSU_VAR"
          echo "SELinux     : $SEL"
          echo "extra patch : $CUSTOM_PATCH"
          {
            echo "## Build A346E Kernel"
            echo ""
            echo "| option | value |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| KSUN source | \`dev branch HEAD (latest at run time)\` |"
            echo "| SELinux | \`${SEL}\` |"
            echo "| Extra patches (patch/*.patch) | \`${CUSTOM_PATCH}\` |"
            echo "| Kernel tree | \`${REAL_DIR}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo ""
            echo "### #1 Checkout & Detect - OK"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #2 System Prep
  # ==========================================================================
  system-prep:
    name: "#2 System Prep"
    needs: detect
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check runner resources & toolchain
        run: |
          set -eu
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "CPUs: $(nproc) | RAM: $(free -g | awk '/Mem:/{print $2}') GB | free disk: ${AVAIL} GB"
          # #6 frees ~25 GB more (dotnet/ghc/android-sdk) before building
          if [ "$AVAIL" -lt 10 ]; then
            echo "::error::only ${AVAIL} GB free on / - the kleaf build cannot fit"
            exit 1
          elif [ "$AVAIL" -lt 20 ]; then
            echo "::warning::only ${AVAIL} GB free on / before cleanup, build may run tight"
          fi
          for t in git curl python3 tar xz; do command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }; done
          python3 --version; git --version
          echo "### #2 System Prep - OK (${AVAIL} GB free before cleanup)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #3 External Deps (KSU / SUSFS)
  # ==========================================================================
  external-deps:
    name: "#3 External Deps (KSU/SUSFS)"
    needs: system-prep
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check KernelSU-Next source is reachable
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          if [ "$KSU_VAR" = "KSUN" ]; then
            URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh"
          else
            URL="https://raw.githubusercontent.com/xnnnsets/KernelSU-Next/refs/heads/next-1/kernel/setup.sh"
          fi
          curl -fsSL --retry 3 "$URL" -o /tmp/setup.sh
          head -n 1 /tmp/setup.sh | grep -q '^#!' || { echo "::error::setup.sh does not look like a script"; exit 1; }
          echo "setup.sh OK ($(wc -l < /tmp/setup.sh) lines) from $URL"

      - name: Fetch & verify SUSFS repos
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 --depth 1
          ( cd susfs4ksu
            git fetch --depth 1 origin f450ec00bf592d080f59b01ff6f9242456c9a427 || true
            git checkout f450ec00bf592d080f59b01ff6f9242456c9a427 || echo "::warning::pinned SUSFS commit unavailable, HEAD used" )
          for repo in https://github.com/xnnnsets/kernel_patches.git \
                      https://github.com/xnnnsets/patch.git \
                      https://github.com/SukiSU-Ultra/SukiSU_patch.git; do
            git clone "$repo" --depth 1
          done
          MISSING=0
          for f in "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" \
                   "susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
                   "patch/6.6/Dont_reduce_TTL.patch" \
                   "kernel_patches/wild/hooks/scope_min_manual_hooks_v1.4.patch" \
                   "kernel_patches/wild/susfs_fix_patches/v1.5.12/1_fix_base.c.patch"; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "::error::MISSING $f"; MISSING=1; fi
          done
          [ "$MISSING" = "0" ] || exit 1

      - name: Nothing to fetch (NO-ROOT)
        if: env.KSU_VAR == 'NO-ROOT'
        run: echo "NO-ROOT variant - no external dependencies"

      - name: Summary
        if: always()
        run: |
          set -eu
          echo "### #3 External Deps - OK (${KSU_VAR})" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #4 Patches -- dry-run EVERY patch that the build will apply.
  #    Order/behaviour mirrors build_kernel.sh exactly:
  #      always : kernel/patches-kernel-6.6/*.patch (apply_kernel66_patches)
  #      if PERMISSIVE=true : Permissive/selinux-make-permissive.patch
  #      if CUSTOM_PATCH=true : patch/*.patch      (apply_optional_patches)
  # ==========================================================================
  patches:
    name: "#4 Patches"
    needs: external-deps
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      # Every job runs on its own runner: detect locally instead of pulling an
      # output from a job that is not a *direct* dependency -- needs.<job> only
      # resolves for direct needs, so `needs.detect.*` here silently expanded to
      # an empty string and every path check failed.
      - name: Detect kernel dir
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then echo "KDIR=Kernel-6.6" >> "$GITHUB_ENV"
          elif [ -f "kernel-6.6/Makefile" ]; then echo "KDIR=kernel-6.6" >> "$GITHUB_ENV"
          else echo "::error::no kernel tree found"; exit 1; fi

      # kernel-6.6/ is pristine upstream; everything this device needs is a
      # patch in kernel/patches-kernel-6.6/, applied on every build by
      # build_kernel.sh (apply_kernel66_patches -> that folder's apply.sh).
      # Dry-run them here so a patch that no longer fits a freshly uploaded
      # kernel tree fails the run in a minute instead of 50 min into the build.
      - name: kernel-6.6 patches (always applied)
        run: |
          set -eu
          A="kernel/patches-kernel-6.6/apply.sh"
          [ -f "$A" ] || { echo "::error::$A missing"; exit 1; }
          chmod +x "$A"
          bash "$A" --check "$KDIR"

      # These fixes live directly in Samsung's own trees (vendor/,
      # kernel/kernel_device_modules-6.6/) because we never replace those
      # wholesale - just make sure none of them got lost.
      - name: Verify in-tree fixes (vendor / device modules)
        run: |
          set -eu
          FAIL=0
          check() { # check <description> <file> <grep-pattern>
            if [ -f "$2" ] && grep -q "$3" "$2"; then
              echo "OK      $1"
            else
              echo "::error::MISSING $1  ($2)"; FAIL=1
            fi
          }
          check "SEC_PM Kconfig"           "kernel/kernel_device_modules-6.6/drivers/samsung/pm/Kconfig" "config SEC_PM"
          check "MAX/MIN guard (stp_uart)" "vendor/mediatek/kernel_modules/connectivity/common/common_main/linux/stp_uart.c" "#ifndef MAX"

          # zram: upstream line is `= CONFIG_ZRAM_DEF_COMP;`. A hand-edit once
          # turned it into `= lzo-rle;` (no quotes) -> build error.
          Z="$KDIR/drivers/block/zram/zram_drv.c"
          if grep -qE '^static const char \*default_compressor = (CONFIG_ZRAM_DEF_COMP|"[a-z0-9-]+");' "$Z"; then
            echo "OK      zram default_compressor is valid C"
          else
            echo "::error::BROKEN zram default_compressor:"; grep -n "default_compressor =" "$Z" || true; FAIL=1
          fi

          # Samsung-only cred API must be gone from the modules we build
          if grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null | grep -q .; then
            echo "::error::get_current_cred_module/put_cred_module still present in vendor/:"
            grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null | sed 's/^/          /'
            FAIL=1
          else
            echo "OK      no Samsung-only cred API in vendor/ (the modules we build)"
          fi

          [ "$FAIL" = "0" ] || { echo "::error::a fix is missing from the source tree - the build would fail"; exit 1; }

      - name: SELinux permissive patch (PERMISSIVE=true)
        if: env.PERMISSIVE == 'true'
        run: |
          set -eu
          P="Permissive/selinux-make-permissive.patch"
          [ -f "$P" ] || { echo "::error::PERMISSIVE=true but $P is missing"; exit 1; }
          if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$P" > /tmp/perm.log 2>&1; then
            echo "APPLIES $(basename "$P") -> $KDIR"
          elif grep -q "Reversed (or previously applied)" /tmp/perm.log; then
            echo "ALREADY $(basename "$P")"
          else
            echo "::error::permissive patch does not apply"; cat /tmp/perm.log; exit 1
          fi
          echo "SELinux will be PERMISSIVE (applied for real in #6 by build_kernel.sh)"

      - name: Skip permissive (PERMISSIVE=false)
        if: env.PERMISSIVE != 'true'
        run: echo "PERMISSIVE=false -> SELinux stays enforcing, permissive patch not applied"

      - name: Extra patches from patch/*.patch (CUSTOM_PATCH=true)
        if: env.CUSTOM_PATCH == 'true'
        run: |
          set -eu
          shopt -s nullglob
          EXTRA=(patch/*.patch)
          shopt -u nullglob
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "::warning::CUSTOM_PATCH=true but patch/ has no *.patch file (kernel/patches-kernel-6.6/ is applied anyway)"
            exit 0
          fi
          FAIL=0
          for p in "${EXTRA[@]}"; do
            base=$(basename "$p")
            if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$p" > /tmp/out.log 2>&1; then
              echo "APPLIES $base -> $KDIR"
            elif grep -q "Reversed (or previously applied)" /tmp/out.log; then
              echo "ALREADY $base"
            else
              echo "::error::BROKEN  $base"; sed 's/^/          /' /tmp/out.log; FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "extra patches: ${#EXTRA[@]} checked (applied for real in #6 by build_kernel.sh)"

      - name: Summary
        run: |
          {
            echo "### #4 Patches - OK"
            echo "- kernel-6.6 patches (\`kernel/patches-kernel-6.6/\`): validated"
            echo "- permissive patch: \`${PERMISSIVE}\`"
            echo "- extra patches (\`patch/*.patch\`): \`${CUSTOM_PATCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #5 KernelSU -- resolve the version that #6 will build and show the
  #    defconfig plan. No tag/pinning: always dev branch HEAD.
  # ==========================================================================
  kernelsu:
    name: "#5 KernelSU"
    needs: patches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Resolve KernelSU-Next version
        id: resolve
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          if [ "$KSU_VAR" = "KSUN" ]; then
            REPO=https://github.com/KernelSU-Next/KernelSU-Next.git; BRANCH=dev
          else
            REPO=https://github.com/xnnnsets/KernelSU-Next.git;      BRANCH=next-1
          fi
          git clone --branch "$BRANCH" "$REPO" /tmp/ksun >/dev/null 2>&1
          cd /tmp/ksun
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          CODE=$((30000 + $(git rev-list --count HEAD)))
          SHA=$(git rev-parse --short HEAD)
          {
            echo "ksu_tag=$TAG"; echo "ksu_code=$CODE"; echo "ksu_sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $BRANCH: $TAG ($CODE) @ $SHA"
          if grep -q KSU_VERSION_FALLBACK kernel/Kbuild; then
            echo "KSU_VERSION_FALLBACK: present"
          else
            echo "::warning::kernel/Kbuild has no KSU_VERSION_FALLBACK - the v0.0.1 fix may need updating (this fork/branch may predate the upstream Kbuild change; cosmetic only, does not fail the build)"
          fi

      - name: Defconfig plan
        run: |
          set -eu
          echo "gki_defconfig additions for $KSU_VAR (between the '# >>> a346e-ci' markers):"
          case "$KSU_VAR" in
            KSUN)               echo "  CONFIG_KSU=y, CONFIG_KPROBES=y, CONFIG_KPROBE_EVENTS=y, CONFIG_MODULES=y" ;;
            KSUN-SUSFS-v1.5.12) echo "  CONFIG_KSU=y, CONFIG_KSU_KPROBES_HOOK=n + 15 CONFIG_KSU_SUSFS_* options" ;;
            NO-ROOT)            echo "  (none)" ;;
          esac
          echo "  + CONFIG_IP_SET* (all variants)"
          {
            echo "### #5 KernelSU - OK"
            echo "- KernelSU-Next: \`${{ steps.resolve.outputs.ksu_tag || 'n/a' }}\` (\`${{ steps.resolve.outputs.ksu_code || 'n/a' }}\`) @ \`${{ steps.resolve.outputs.ksu_sha || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #6 Build -- the real one. Self-contained: fresh runner, fresh checkout.
  # ==========================================================================
  build:
    name: "#6 Build"
    needs: kernelsu
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      image_size: ${{ steps.build.outputs.image_size }}
      image_sha: ${{ steps.build.outputs.image_sha }}
      artifact: ${{ steps.meta.outputs.artifact }}
      selinux: ${{ steps.meta.outputs.selinux }}
      ksu_tag: ${{ steps.ksu.outputs.ksu_tag }}
      ksu_code: ${{ steps.ksu.outputs.ksu_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          sudo apt-get remove --purge -y '^php.*' '^dotnet-.*' '^mysql-.*' \
                      '^firefox.*' '^mongodb-.*' '^postgresql-.*' azure-cli \
                      google-chrome-stable google-cloud-cli >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo "--- after ---"; df -h /

      - name: Install host dependencies
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            curl wget unzip git rsync ca-certificates \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev dwarves \
            lz4 zstd cpio libxml2-utils xsltproc \
            python3 python3-pip python3-setuptools python3-dev \
            zlib1g-dev libbz2-dev liblz4-dev libzstd-dev
          git config --global user.email "builder@example.com"
          git config --global user.name  "Builder"
          git config --global --add safe.directory "*"

      - name: Set kernel dir & artifact name
        id: meta
        run: |
          set -eu
          if [ -f "Kernel-6.6/Makefile" ]; then REAL_DIR=Kernel-6.6
          elif [ -f "kernel-6.6/Makefile" ]; then REAL_DIR=kernel-6.6
          else echo "::error::no kernel tree found"; exit 1; fi
          echo "REAL_DIR=$REAL_DIR" >> "$GITHUB_ENV"
          echo "G_KERNEL=$GITHUB_WORKSPACE/$REAL_DIR" >> "$GITHUB_ENV"
          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "$CUSTOM_PATCH" = "true" ] && echo custom || echo nocustom)
          echo "selinux=$SEL" >> "$GITHUB_OUTPUT"
          echo "artifact=kernel-image-${KSU_VAR}-${SEL}-${CUS}" >> "$GITHUB_OUTPUT"

      - name: External deps (SUSFS only)
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          [ -d susfs4ksu ] || git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 --depth 1
          ( cd susfs4ksu
            git fetch --depth 1 origin f450ec00bf592d080f59b01ff6f9242456c9a427 || true
            git checkout f450ec00bf592d080f59b01ff6f9242456c9a427 || true )
          for repo in https://github.com/xnnnsets/kernel_patches.git \
                      https://github.com/xnnnsets/patch.git \
                      https://github.com/SukiSU-Ultra/SukiSU_patch.git; do
            dir=$(basename "$repo" .git); [ -d "$dir" ] || git clone "$repo" --depth 1
          done

      # Applies 4 patches to the checked-out kernel tree ($G_KERNEL). Each is
      # checked APPLIED / ALREADY (harmless, previously-applied) / BROKEN
      # (real failure -> stop the build instead of a silent warning), since
      # KernelSU-Next for this variant tracks a moving branch (not pinned)
      # and can drift out from under these patches -- see header note.
      - name: SUSFS kernel patches
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          SUSFS_DIR="$G_EXT/susfs4ksu"
          cp -v "$SUSFS_DIR"/kernel_patches/include/linux/* "$G_KERNEL/include/linux/" || true
          cp -v "$SUSFS_DIR"/kernel_patches/fs/*            "$G_KERNEL/fs/"            || true
          cd "$G_KERNEL"
          FAIL=0
          for p in "$G_EXT/patch/6.6/Dont_reduce_TTL.patch" \
                   "$G_EXT/kernel_patches/wild/hooks/scope_min_manual_hooks_v1.4.patch" \
                   "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" \
                   "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/1_fix_base.c.patch"; do
            base=$(basename "$p")
            echo "--- $base"
            if patch -p1 --forward --batch < "$p" > "/tmp/log_${base}.log" 2>&1; then
              echo "APPLIED $base"
            elif grep -q "Reversed (or previously applied)" "/tmp/log_${base}.log"; then
              echo "ALREADY $base"
            else
              echo "::error::BROKEN  $base -- patch no longer matches the kernel tree"
              cat "/tmp/log_${base}.log"
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || { echo "::error::a SUSFS kernel patch genuinely failed - SUSFS would be silently missing from this build"; exit 1; }
          # GKI protected exports block SUSFS symbols
          grep -rl "protected_exports_list" --include="BUILD.bazel" "$GITHUB_WORKSPACE/$REAL_DIR" 2>/dev/null | while read -r f; do
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find "$GITHUB_WORKSPACE/$REAL_DIR" -iname "abi_gki_protected_exports*" -type f -delete 2>/dev/null || true

      - name: Add KernelSU-Next
        id: ksu
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          cd "$G_KERNEL"
          rm -rf KernelSU-Next
          case "$KSU_VAR" in
            KSUN)
              # setup.sh does a FRESH clone every run -> always the newest dev
              # HEAD, today and in a year. No tag, no pinning, no input.
              curl -LSs --retry 3 https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh dev
              ;;
            KSUN-SUSFS-v1.5.12)
              curl -LSs --retry 3 https://raw.githubusercontent.com/xnnnsets/KernelSU-Next/refs/heads/next-1/kernel/setup.sh -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh next-1
              # To pin this fork once you have a known-good commit:
              #   git -C KernelSU-Next checkout <KNOWN_GOOD_SHA>
              FAIL=0
              for p in "$G_EXT/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_core_hook.c.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_sucompat.c.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_kernel_compat.c.patch"; do
                base=$(basename "$p")
                echo "--- $base"
                if patch -p1 -d ./KernelSU-Next --forward --batch < "$p" > "/tmp/log_${base}.log" 2>&1; then
                  echo "APPLIED $base"
                elif grep -q "Reversed (or previously applied)" "/tmp/log_${base}.log"; then
                  echo "ALREADY $base"
                else
                  echo "::error::BROKEN  $base -- patch no longer matches xnnnsets/KernelSU-Next@next-1"
                  cat "/tmp/log_${base}.log"
                  FAIL=1
                fi
              done
              [ "$FAIL" = "0" ] || { echo "::error::a SUSFS/KernelSU-Next patch genuinely failed"; exit 1; }
              ;;
          esac
          [ -d KernelSU-Next ] || { echo "::error::KernelSU-Next missing after setup.sh"; exit 1; }

          cd KernelSU-Next
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          KSU_CODE=$((30000 + $(git rev-list --count HEAD 2>/dev/null || echo 0)))
          KSU_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          # Fix "v0.0.1 (1-2)" in the manager: build_kernel.sh copies the tree
          # into the bazel workspace with `rsync --copy-links`, which turns the
          # drivers/kernelsu -> ../KernelSU-Next/kernel symlink into a plain
          # copy. Kbuild can then no longer find its own git repo and falls back
          # to KSU_VERSION=1 / KSU_VERSION_TAG=v0.0.1 -> bake in the real values.
          if [ -f kernel/Kbuild ] && grep -q KSU_VERSION_FALLBACK kernel/Kbuild; then
            sed -i "s|^KSU_VERSION_FALLBACK := .*|KSU_VERSION_FALLBACK := ${KSU_CODE}|"        kernel/Kbuild
            sed -i "s|^KSU_VERSION_TAG_FALLBACK := .*|KSU_VERSION_TAG_FALLBACK := ${KSU_TAG}|" kernel/Kbuild
            grep -n "KSU_VERSION_FALLBACK\|KSU_VERSION_TAG_FALLBACK" kernel/Kbuild
          else
            echo "::warning::KSU_VERSION_FALLBACK not found in kernel/Kbuild (layout changed, or this fork/branch predates the upstream fix - KSU version may show as v0.0.1 in Manager; does not fail the build)"
            echo "--- kernel/Kbuild version-related lines (for debugging) ---"
            [ -f kernel/Kbuild ] && grep -n -i "version" kernel/Kbuild || echo "kernel/Kbuild missing entirely"
          fi
          { echo "KSU_GIT_TAG=$KSU_TAG"; echo "KSU_VERSION=$KSU_CODE"; echo "KSU_COMMIT=$KSU_SHA"; } >> "$GITHUB_ENV"
          { echo "ksu_tag=$KSU_TAG"; echo "ksu_code=$KSU_CODE"; } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $KSU_TAG ($KSU_CODE) @ $KSU_SHA"

      - name: Defconfig (KSU + IPSet)
        run: |
          set -eu
          DEFCONFIG="$G_KERNEL/arch/arm64/configs/gki_defconfig"
          # Everything we add lives between markers, so re-running only ever
          # replaces our own block and never touches upstream lines (the old
          # code deleted CONFIG_KPROBES=y and only put it back for KSUN, so
          # NO-ROOT builds silently lost kprobes).
          sed -i '/^# >>> a346e-ci$/,/^# <<< a346e-ci$/d' "$DEFCONFIG"
          echo "# >>> a346e-ci" >> "$DEFCONFIG"

          case "$KSU_VAR" in
            KSUN)
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          EOF
              ;;
            KSUN-SUSFS-v1.5.12)
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_MODULES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
              ;;
          esac

          # IPSet (needed by most firewall / adblock apps) -- all variants
          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
          echo "# <<< a346e-ci" >> "$DEFCONFIG"
          echo "--- defconfig tail ---"; tail -n 30 "$DEFCONFIG"

      # build_kernel.sh applies, in this order:
      #   apply_optional_patches : Permissive/ (PERMISSIVE=true) + patch/*.patch (CUSTOM_PATCH=true)
      #   apply_kernel66_patches : kernel/patches-kernel-6.6/*.patch (always)
      #   apply_compat_fixes     : inline loop.h / MAX-MIN / SEC_PM fixes
      - name: Build kernel
        id: build
        run: |
          set -eu
          chmod +x ./build_kernel.sh
          echo "PERMISSIVE=$PERMISSIVE  CUSTOM_PATCH=$CUSTOM_PATCH  KSU_VAR=$KSU_VAR"
          if ! bash ./build_kernel.sh 2>&1 | tee build.log; then
            echo "::error::build_kernel.sh failed - see the build-log artifact"
            tail -n 60 build.log || true
            exit 1
          fi
          [ -f Image ] || { echo "::error::Image not produced"; find out -name Image -type f | head; exit 1; }
          echo "image_size=$(du -h Image | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(sha256sum Image | cut -c1-16)"    >> "$GITHUB_OUTPUT"
          if [ "$PERMISSIVE" = "true" ]; then
            grep -q "SELinux permissive patch" build.log || echo "::warning::permissive requested but not confirmed in the log"
          fi
          ls -lh Image

      - name: Upload Image
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: Image
          if-no-files-found: error
          compression-level: 6

      - name: Upload build log (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

  # ==========================================================================
  # #7 Upload & Summary
  # ==========================================================================
  upload-summary:
    name: "#7 Upload & Summary"
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report
        run: |
          set -eu
          {
            echo "### #7 Result: \`${{ needs.build.result }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| KSU variant | \`${KSU_VAR}\` |"
            echo "| KernelSU-Next | \`${{ needs.build.outputs.ksu_tag || 'n/a' }}\` (\`${{ needs.build.outputs.ksu_code || 'n/a' }}\`) |"
            echo "| SELinux | \`${{ needs.build.outputs.selinux || env.PERMISSIVE }}\` |"
            echo "| Image | \`${{ needs.build.outputs.image_size || 'n/a' }}\` sha256:\`${{ needs.build.outputs.image_sha || 'n/a' }}\` |"
            echo "| Artifact | \`${{ needs.build.outputs.artifact || 'n/a' }}\` (only the Image) |"
            echo ""
            echo "Pipeline: #1 ●──● #2 ●──● #3 ●──● #4 ●──● #5 ●──● #6 ●──● #7"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when the build fails
        if: needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > issue.md <<EOF
          Build failed: [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          | field | value |
          |---|---|
          | commit | \`${{ github.sha }}\` |
          | branch | \`${{ github.ref_name }}\` |
          | KSU | \`${KSU_VAR}\` |
          | permissive | \`${PERMISSIVE}\` |
          | extra patches | \`${CUSTOM_PATCH}\` |

          The \`build-log-${{ github.run_id }}\` artifact of that run has the full log.
          EOF
          gh issue create --title "Build failed #${{ github.run_id }} [${KSU_VAR}]" --body-file issue.md || true
