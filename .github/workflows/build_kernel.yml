name: Build A346E Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a07254-kernel-samsung-a346e
      - Google
      - Test-Build
      - a346E-Stock

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up dependencies and free disk
        run: |
          set -eux
          df -h
          # Free up large unnecessary packages (keep clang for safety)
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo apt-get remove --purge -y "php*" "dotnet*" "mysql*" "nodejs*" "google*" "firefox*" "mongodb*" "postgresql*" "azure-cli*" || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
          sudo apt-get update -y
          sudo apt-get install -y curl wget unzip python3 python3-pip git rsync bc bison flex build-essential libssl-dev libelf-dev libncurses-dev dwarves lz4 zstd cpio libxml2-utils xsltproc python3-setuptools python3-dev zlib1g-dev libbz2-dev liblz4-dev libzstd-dev
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          git config --global --add safe.directory "*"
          python3 --version
          git --version
          df -h
          free -h
          nproc

      - name: Run build script
        run: |
          set -euxo pipefail
          chmod +x ./build_kernel.sh
          # Run with tee to capture log for artifact
          bash ./build_kernel.sh 2>&1 | tee build.log
          echo "Build script exit code: ${PIPESTATUS[0]}"
          ls -lh Image build.log || true
          df -h
          # Ensure Image exists, if not, fail with clear message but still upload log
          if [ ! -f Image ]; then
            echo "ERROR: Image not found after build, checking out folder"
            find out -type f -name "Image" | head -n 20 || true
            ls -R out/target/product/a34x/obj/KLEAF_OBJ/dist 2>&1 | head -n 100 || true
          fi

      - name: Upload kernel Image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            Image
            build.log
            out/target/product/a34x/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/Image
            out/**/Image
          if-no-files-found: warn

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
