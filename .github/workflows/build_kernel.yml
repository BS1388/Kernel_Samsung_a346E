name: Build Samsung A34 Kernel
on:
  push:
    branches: [ "a346E-Test" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: a346E-Test
          submodules: 'recursive'
          lfs: true

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: lemniskett/AnyKernel3
          path: zipper

      - name: Fix Prebuilts Path for Bazel
        run: |
          mkdir -p kernel/prebuilts/build-tools/path/linux-x86
          # لینک کردن تمام ابزارهای سیستم برای جلوگیری از ارورهای بعدی Bazel
          ln -sf /usr/bin/* kernel/prebuilts/build-tools/path/linux-x86/
          ln -sf $(which python3) kernel/prebuilts/build-tools/path/linux-x86/python

      - name: Android Kernel Build
        uses: lemniskett/android-kernel-actions@master
        id: build
        env:
          NAME: Kernel_A346E
          KERNEL_PATH: kernel/kernel_device_modules-6.6
        with:
          arch: arm64
          compiler: clang/15/binutils
          defconfig: a34x_defconfig
          image: Image.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A346E-Kernel-ZIP
          path: ${{ steps.build.outputs.outfile }}
